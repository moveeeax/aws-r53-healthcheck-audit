name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Tests
        run: pytest -q

      - name: CLI smoke
        run: aws-r53-healthcheck-audit --version && aws-r53-healthcheck-audit --help

      - name: Offline demo exits 1 on the fixture account
        run: |
          set +e
          python examples/demo.py
          code=$?
          set -e
          test "$code" -eq 1
